<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login Page</title>
    <link rel="icon" type="image/png" href="Assets/Ecologo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
<link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
     />
    <link rel="stylesheet" href="AdminLogin.css"/>
</head>
<body>
   <div class="left-side"  >
            <img src="Assets/pics.png" class="overlay-image">
      <div class="down-image">
            <img src="Assets/Landing Image.png">
      </div>
    </div>


    <div class="right-side">
        <div class="Header">
            <h2>Welcome <span>Back!</span></h2>
            <p class="subtitle">Login and continue your journey.</p>
        </div>  
        <div class="login-container">
            <form id="admin-login-form">
                <div class="input-group">
                    <label for="email">Admin ID</label>
                    <input type="text" id="email" placeholder="Enter Admin ID" required>
                </div>
                
                <div class="input-1">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" placeholder="Enter password" required>
                        <i class="ph ph-eye" id="show-password"></i>
                    </div>
                </div>
                
                <div class="options">
                    <a href="#">Forgot password?</a>
                </div>
                
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
  <script src="AdminLogin.js"></script>
</body>
</html>
